name: Cargo Git authentication
description: Configure Cargo to fetch one private GitHub repository

inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  owner:
    description: Private repository owner
    required: true
  repository:
    description: Private repository name
    required: true

runs:
  using: composite
  steps:
    - name: Validate configuration
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.client-id }}
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
        REPOSITORY_OWNER: ${{ inputs.owner }}
        REPOSITORY_NAME: ${{ inputs.repository }}
      run: |
        test -n "$APP_CLIENT_ID"
        test -n "$APP_PRIVATE_KEY"
        test -n "$REPOSITORY_OWNER"
        test -n "$REPOSITORY_NAME"

    - name: GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repository }}
        permission-contents: read

    - name: Configure Git access
      shell: bash
      env:
        GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        REPOSITORY_OWNER: ${{ inputs.owner }}
        REPOSITORY_NAME: ${{ inputs.repository }}
      run: |
        git config --global \
          url."https://x-access-token:${GH_APP_TOKEN}@github.com/${REPOSITORY_OWNER}/${REPOSITORY_NAME}.git".insteadOf \
          "https://github.com/${REPOSITORY_OWNER}/${REPOSITORY_NAME}.git"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
