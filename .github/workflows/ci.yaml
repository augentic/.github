# Reusable CI workflow for Rust
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows

name: CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Cargo workspace directory
        type: string
        default: "."
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: rust+clippy
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          # Only save caches on the default branch; PR caches would evict
          # main's under the 10 GB per-repo cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: ${{ inputs.working-directory }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: rust@nightly+rustfmt
          fallback: none
      - run: cargo +nightly fmt --all --check
        working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: rust,nextest
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --locked --tests --all-features --no-tests=pass
        working-directory: ${{ inputs.working-directory }}

  test-doc:
    name: Test docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: rust
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: lib
        working-directory: ${{ inputs.working-directory }}
        # Detect a library target via cargo metadata
        run: |
          cargo metadata --format-version 1 --no-deps |
            jq -r '"exists=\(any(.packages[].targets[].kind[];
              IN("lib", "rlib", "cdylib", "dylib", "staticlib", "proc-macro")))"' \
              >> "$GITHUB_OUTPUT"
      - if: steps.lib.outputs.exists == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --doc --locked --all-features --workspace

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: rust
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --workspace --all-features --locked
        working-directory: ${{ inputs.working-directory }}

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: rust,cargo-vet
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo vet --locked
        working-directory: ${{ inputs.working-directory }}

  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
          fallback: none
      - run: cargo deny --workspace --locked check
        working-directory: ${{ inputs.working-directory }}
