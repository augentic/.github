# Reusable CI workflow for Rust
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows

name: CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Cargo workspace directory
        type: string
        default: "."
      owner:
        description: Owner of a private Git dependency
        type: string
        default: ""
      repository:
        description: Name of a private Git dependency
        type: string
        default: ""
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: ${{ inputs.working-directory }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check
        working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --locked --tests --all-features --no-tests=pass
        working-directory: ${{ inputs.working-directory }}

  test-doc:
    name: Test docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - id: lib
        working-directory: ${{ inputs.working-directory }}
        # Detect a library target via cargo metadata so we don't depend on
        # cargo's stderr wording or pay for a throwaway compile.
        run: |
          has_lib=$(cargo metadata --format-version 1 --no-deps \
            | jq '[.packages[].targets[].kind[]
                   | select(IN("lib","rlib","cdylib","dylib","staticlib","proc-macro"))]
                   | length > 0')
          echo "exists=$has_lib" >> "$GITHUB_OUTPUT"
      - if: steps.lib.outputs.exists == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --doc --locked --all-features --workspace

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - run: cargo doc --no-deps --workspace --all-features --locked
        working-directory: ${{ inputs.working-directory }}

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked
        working-directory: ${{ inputs.working-directory }}

  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Private Git access
        if: inputs.repository != ''
        uses: augentic/.github/.github/actions/cargo-git-auth@main
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          arguments: --workspace --locked
